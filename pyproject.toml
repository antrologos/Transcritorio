[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcritorio"
version = "0.2.1"
description = "Transcricao local de entrevistas em portugues brasileiro, com separacao de falantes (WhisperX + pyannote). Nenhum audio sai do computador."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rogerio Jeronimo Barbosa" }]
# Teto necessario: torchcodec/torch/PySide6 demoram a publicar wheels para
# CPython novo — sem o teto, o uv escolhe o Python mais recente da maquina
# (ex.: 3.14) e a resolucao falha (bug real de beta tester, 2026-08-24).
# Com o teto, o uv baixa sozinho um 3.12/3.13 gerenciado.
requires-python = ">=3.10,<3.14"
keywords = ["transcricao", "whisper", "whisperx", "diarizacao", "entrevistas", "pesquisa-qualitativa", "asr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "PySide6==6.11.0",
    "whisperx==3.8.5",
    "pyannote-audio==4.0.4",
    "faster-whisper==1.2.1",
    "torchcodec==0.7.0",
    "huggingface_hub>=0.28.1",
    "python-docx>=1.2.0",
    "jiwer>=3.0.0",
    "keyring>=24",
    "cryptography>=42",
    # Motor experimental Parakeet pt-BR (TAGARELA) via ONNX (E4-4).
    # onnxruntime CPU: ~13x tempo real medido na RTX 4060 (so CPU);
    # onnxruntime-gpu NAO entra no extra [cuda] — conflita com o pacote
    # CPU e exigiria cuDNN proprio, sem ganho necessario.
    "onnx-asr>=0.12,<1.0",
    # Piso 1.20 (ultima serie com wheel py3.10); em py3.11+ resolve 1.29+.
    "onnxruntime>=1.20",
]

[project.urls]
Homepage = "https://antrologos.github.io/Transcritorio/pt/"
Repository = "https://github.com/antrologos/Transcritorio"
Changelog = "https://github.com/antrologos/Transcritorio/blob/main/CHANGELOG.md"
Issues = "https://github.com/antrologos/Transcritorio/issues"

[project.scripts]
transcritorio-cli = "transcribe_pipeline.cli:main"

[project.gui-scripts]
transcritorio = "transcribe_pipeline.gui_launcher:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
# Apple Silicon Metal acceleration via MLX. Installs only on macOS ARM64
# (mlx framework does not build on Windows/Linux). Safe to leave off the
# default dependency set — the runtime code path checks availability and
# falls back to the CPU whisperx path.
mac = ["mlx-whisper>=0.4.0"]
# Aceleracao NVIDIA (opcional, v0.2): declara torch/torchaudio/torchvision
# explicitamente para que o uv resolva os TRES do indice cu128 do PyTorch
# (ver [tool.uv.sources]) — misturar torch-cu128 com torchaudio/vision CPU
# do PyPI quebra por ABI. Sem este extra, tudo vem transitivamente do PyPI,
# que no Windows e CPU-only: o caminho seguro e o caminho default.
# pip puro: pip install "transcritorio[cuda]" --extra-index-url https://download.pytorch.org/whl/cu128
cuda = ["torch>=2.7", "torchaudio>=2.7", "torchvision>=0.22"]
# NAO existe extra [llm], de proposito: transformers>=5.13 (necessario para
# o Qwen3.5 da analise local) exige huggingface-hub>=1.5, e o whisperx
# 3.8.5 trava hub<1.0 — irreconciliavel no mesmo ambiente (uv lock,
# 2026-08-25). A analise local usa um AMBIENTE DEDICADO gerenciado pelo
# app (transcribe_pipeline/llm_env.py), criado sob demanda via uv — mesmo
# padrao do cuda_pack. O LLM ja roda em subprocesso por desenho.

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "cuda" }]
torchaudio = [{ index = "pytorch-cu128", extra = "cuda" }]
torchvision = [{ index = "pytorch-cu128", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
include = ["transcribe_pipeline*"]

[tool.setuptools.package-data]
# assets/* (icones): sem eles o app instalado por uv rodava sem icone de
# janela e o atalho da area de trabalho herdava o icone do pythonw.
transcribe_pipeline = ["py.typed", "assets/*"]
