# =============================================================================
# Publica o pacote transcritorio no PyPI via TRUSTED PUBLISHING (OIDC).
#
# Canal de distribuicao oficial a partir da v0.2 (plano
# 2026-08-23_v02-pypi-uv-migracao): os usuarios instalam com
#   winget install astral-sh.uv
#   uv tool install transcritorio
#   transcritorio
#
# Sem tokens armazenados: o PyPI confia no OIDC do GitHub Actions.
# CONFIGURACAO UNICA (feita pelo mantenedor no site do PyPI):
#   PyPI -> conta -> Publishing -> Add a new pending publisher:
#     project:      transcritorio
#     owner:        antrologos
#     repository:   Transcritorio
#     workflow:     publish.yml
#     environment:  pypi
# E no GitHub: Settings -> Environments -> criar "pypi" (opcional: exigir
# aprovacao manual antes de cada publicacao).
# =============================================================================
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PY_VER=$(grep -Po '(?<=^version = ")[^"]+' pyproject.toml)
          echo "tag=$TAG_VER pyproject=$PY_VER"
          if [ "$TAG_VER" != "$PY_VER" ]; then
            echo "MISMATCH: tag v$TAG_VER != pyproject $PY_VER. Bumpe a versao antes do tag."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-check the wheel metadata
        run: |
          python -m pip install --quiet twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # So publica em tag v*; workflow_dispatch serve para testar o build.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
